<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Wanderer Descending a Misty Mountain</title>
  <desc id="desc">A cartoon wanderer walks downhill on a winding mountain path. Translucent clouds cover several sections of the path.</desc>

  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#263c67"/>
      <stop offset=".68" stop-color="#31507f"/>
      <stop offset="1" stop-color="#426895"/>
    </linearGradient>
    <linearGradient id="mountain" x1=".28" x2=".78" y1=".15" y2=".95">
      <stop offset="0" stop-color="#9be37f"/>
      <stop offset=".55" stop-color="#69bd68"/>
      <stop offset="1" stop-color="#4d985d"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbfb"/>
      <stop offset="1" stop-color="#d8dee2"/>
    </linearGradient>
    <radialGradient id="localLight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe89b" stop-opacity=".58"/>
      <stop offset=".55" stop-color="#ffe89b" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffe89b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1220" flood-opacity=".25"/>
    </filter>
    <clipPath id="mountainClip" clipPathUnits="userSpaceOnUse">
      <path d="M78 800c34-211 159-437 360-552 75-43 159-67 240-62 190 12 322 159 420 444 20 58 29 115 33 170z"/>
    </clipPath>
    <marker id="descentArrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ffe89b"/>
    </marker>
    <style>
      .path-edge { fill: none; stroke: #7a4b2a; stroke-width: 58; stroke-linecap: round; stroke-linejoin: round; }
      .path-main { fill: none; stroke: #b9783f; stroke-width: 40; stroke-linecap: round; stroke-linejoin: round; }
      .cloud-back { fill: #cfd6da; }
      .cloud-front { fill: url(#cloud); }
      .cloud-line { fill: none; stroke: #c5ccd1; stroke-width: 4; stroke-linecap: round; opacity: .7; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <path d="M336 72c-44 13-76 55-76 104 0 56 42 102 96 108-28-24-45-59-45-98 0-48 26-90 65-112-13-5-27-6-40-2z" fill="#ffd55c"/>
